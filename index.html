<!DOCTYPE html>
<html>
<head>
<title>Digital Flower Bouquet</title>
<style>
body {
  background: linear-gradient(to bottom, #f4b183, #e89c6c);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
  font-family: sans-serif;
}

/* Bouquet Wrapper */
.bouquet {
  position: relative;
  width: 400px;
  height: 500px;
}

/* Flowers Container */
.flowers {
  position: absolute;
  top: 40px;
  left: 50%;
  transform: translateX(-50%);
  width: 350px;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 15px;
}

/* Flower Base */
.flower {
  width: 80px;
  height: 80px;
  position: relative;
}

.petal {
  width: 40px;
  height: 40px;
  background: pink;
  position: absolute;
  border-radius: 50%;
  top: 20px;
  left: 20px;
}

.petal:nth-child(1) { transform: rotate(0deg) translate(30px); }
.petal:nth-child(2) { transform: rotate(60deg) translate(30px); }
.petal:nth-child(3) { transform: rotate(120deg) translate(30px); }
.petal:nth-child(4) { transform: rotate(180deg) translate(30px); }
.petal:nth-child(5) { transform: rotate(240deg) translate(30px); }
.petal:nth-child(6) { transform: rotate(300deg) translate(30px); }

.center {
  width: 35px;
  height: 35px;
  background: gold;
  border-radius: 50%;
  position: absolute;
  top: 22px;
  left: 22px;
}

/* Different Flower Colors */
.red .petal { background: #e63946; }
.yellow .petal { background: #ffbe0b; }
.pink .petal { background: #ff4da6; }
.orange .petal { background: #ff7f11; }
.purple .petal { background: #9b5de5; }

/* Burlap Wrapper */
.wrapper {
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 300px;
  height: 250px;
  background: #b08968;
  clip-path: polygon(0 0, 100% 0, 80% 100%, 20% 100%);
  border-radius: 20px;
}

/* Ribbon */
.ribbon {
  position: absolute;
  bottom: 100px;
  left: 50%;
  transform: translateX(-50%);
  width: 120px;
  height: 40px;
  background: brown;
  border-radius: 20px;
}

.ribbon:before, .ribbon:after {
  content: "";
  position: absolute;
  width: 40px;
  height: 40px;
  background: brown;
  border-radius: 50%;
  top: 0;
}

.ribbon:before { left: -20px; }
.ribbon:after { right: -20px; }

</style>
</head>
<body>

<div class="bouquet">

  <div class="flowers">
    <div class="flower red">
      <div class="petal"></div><div class="petal"></div>
      <div class="petal"></div><div class="petal"></div>
      <div class="petal"></div><div class="petal"></div>
      <div class="center"></div>
    </div>

    <div class="flower yellow">
      <div class="petal"></div><div class="petal"></div>
      <div class="petal"></div><div class="petal"></div>
      <div class="petal"></div><div class="petal"></div>
      <div class="center"></div>
    </div>

    <div class="flower pink">
      <div class="petal"></div><div class="petal"></div>
      <div class="petal"></div><div class="petal"></div>
      <div class="petal"></div><div class="petal"></div>
      <div class="center"></div>
    </div>

    <div class="flower orange">
      <div class="petal"></div><div class="petal"></div>
      <div class="petal"></div><div class="petal"></div>
      <div class="petal"></div><div class="petal"></div>
      <div class="center"></div>
    </div>

    <div class="flower purple">
      <div class="petal"></div><div class="petal"></div>
      <div class="petal"></div><div class="petal"></div>
      <div class="petal"></div><div class="petal"></div>
      <div class="center"></div>
    </div>
  </div>

  <div class="wrapper"></div>
  <div class="ribbon"></div>

</div>

</body>
</html>
